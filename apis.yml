name: Wintermute
description: >-
  Wintermute is a leading global algorithmic trading firm and cryptocurrency
  market maker providing institutional-grade liquidity across centralized
  exchanges, decentralized finance (DeFi) protocols, and over-the-counter (OTC)
  markets. Its offerings span OTC spot trading for hundreds of tokens, options
  with bespoke structures, forwards, CFDs, programmatic "API liquidity", and a
  DeFi trading and liquidity-provisioning arm, plus Wintermute Ventures, an
  early-stage investment vehicle. Access to Wintermute's trading services is
  institutional and onboarding-gated through the node.wintermute.com portal
  (authenticated via an Auth0-backed OIDC / OAuth2 identity provider); there is
  no public self-serve developer API or open OpenAPI at this time. Added to the
  API Evangelist network as a portfolio company of Lightspeed Venture Partners
  and Pantera Capital.
